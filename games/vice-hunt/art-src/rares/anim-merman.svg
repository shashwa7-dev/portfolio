  <path d="M66 54 L66 62 L80 62 L80 54 Z" fill="#b97a54" stroke="#2b2234" stroke-width="1.8"/>
  <ellipse cx="73" cy="40" rx="15" ry="17" fill="#c98a62" stroke="#2b2234" stroke-width="2"/>
  <!-- parted silver hair on top, waves falling either side of the face -->
  <path d="M73 19 C64 18 57 24 56 34 C55 40 56 46 58 50 C59 44 60 38 63 33 C66 28 70 26 73 25 Z" fill="#e3e5e9" stroke="#2b2234" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M73 19 C82 18 89 24 90 34 C91 40 90 46 88 50 C87 44 86 38 83 33 C80 28 76 26 73 25 Z" fill="#e3e5e9" stroke="#2b2234" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M66 22 Q61 27 60 36 M80 22 Q85 27 86 36" fill="none" stroke="#b9bec6" stroke-width="1.4" stroke-linecap="round"/>
  <!-- white bushy brows -->
  <path d="M63 35 Q67 32 71 35 M75 35 Q79 32 83 35" fill="none" stroke="#f4f4f2" stroke-width="2.6" stroke-linecap="round"/>
  <!-- sunglasses -->
  <path d="M64 38 L84 38 L83 44 C81 47 77 47 75 44 L74 41 L72 41 L71 44 C69 47 65 47 64 44 Z" fill="#e8789f" stroke="#2b2234" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M66 40 L69 40" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
  <!-- big fluffy beard, white going grey -->
  <path d="M58 41 C55 50 55 58 59 64 C57 69 61 74 66 71 C66 78 73 80 74 75 C78 80 85 78 84 71 C89 74 93 69 90 63 C94 57 92 48 88 41 C85 48 80 51 73 51 C66 51 61 48 58 41 Z" fill="#f4f4f2" stroke="#2b2234" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M62 56 Q65 60 63 64 M70 60 Q73 65 71 70 M78 60 Q81 65 79 70 M86 56 Q88 60 86 64" fill="none" stroke="#c4c9cf" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M66 70 Q70 74 74 74 Q78 74 84 70" fill="none" stroke="#d5d9de" stroke-width="2.2" stroke-linecap="round"/>
  <!-- moustache -->
  <path d="M63 49 C67 45 72 46 73 49 C74 46 79 45 83 49 C80 53 76 53 73 51 C70 53 66 53 63 49 Z" fill="#e6e8ea" stroke="#2b2234" stroke-width="1.4" stroke-linejoin="round"/>
