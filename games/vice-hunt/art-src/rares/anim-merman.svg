  </g>
  <!-- shell necklace -->
  <path d="M60 62 Q73 72 86 62" fill="none" stroke="#fbe9d2" stroke-width="2"/>
  <path d="M70 68 L73 74 L76 68 Q73 66 70 68 Z" fill="#f49ea3" stroke="#2b2234" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- long wavy silver hair falling past the shoulders, behind -->
  <path d="M62 26 C54 30 50 40 50 50 C49 58 46 62 47 70 C48 76 44 80 46 86 Q50 84 52 88 Q54 82 57 84 C56 76 59 70 58 62 C57 54 59 44 63 36 Z" fill="#c4c8cf" stroke="#2b2234" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M84 26 C92 30 96 40 96 50 C97 58 100 62 99 70 C98 76 102 80 100 86 Q96 84 94 88 Q92 82 89 84 C90 76 87 70 88 62 C89 54 87 44 83 36 Z" fill="#c4c8cf" stroke="#2b2234" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M54 42 Q51 54 52 64 Q53 72 50 80 M92 42 Q95 54 94 64 Q93 72 96 80" fill="none" stroke="#a3a9b2" stroke-width="1.5" stroke-linecap="round"/>
