<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 102">
  <!-- tail fin flicking out of the water behind him -->
  <g class="tail"><path d="M18 92 C14 78 8 70 2 64 C12 64 20 68 24 76 C26 66 32 58 42 54 C38 64 36 78 34 92 Z" fill="#2fb5a8" stroke="#2b2234" stroke-width="2" stroke-linejoin="round"/>
  <path d="M10 68 Q18 72 22 82 M38 60 Q32 70 30 84" fill="none" stroke="#1d8a80" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <!-- torso -->
  <path d="M58 60 C50 64 48 80 50 100 L96 100 C98 80 96 64 88 60 C80 56 66 56 58 60 Z" fill="#c98a62" stroke="#2b2234" stroke-width="2" stroke-linejoin="round"/>
